[package]
name = "openstorage"
version = "0.1.0"
description = "A tiny, fast disk usage visualizer: a sortable tree and a treemap of every file."
license = "MIT"
repository = "https://github.com/MarshallNickolauson/OpenStorage"
rust-version = "1.85"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
